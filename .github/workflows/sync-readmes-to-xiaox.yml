# Sync every README*.md in this repo into 小X (小助手, X-connect front-desk /
# customer-service assistant) knowledge: knowledge/xiaox/craft-skills/ in
# xuliangwang1993-ops/X-connect, then regenerate the Dart knowledge docs and
# open/refresh a PR there (never merges).
#
# Required secret (repo Settings → Secrets → Actions):
#   XCONNECT_KB_TOKEN  fine-grained PAT, repo X-connect only,
#                      Contents: read/write + Pull requests: read/write.
# Optional (live R2 copy at dl.x-connect.ai/config/knowledge/craft-skills/):
#   CLOUDFLARE_API_TOKEN (R2 edit), CLOUDFLARE_ACCOUNT_ID
name: sync-readmes-to-xiaox

on:
  push:
    branches: ['**']
    paths: ['**/README*.md', '**/readme*.md']
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-readmes-to-xiaox
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      XC_REPO: xuliangwang1993-ops/X-connect
      SYNC_BRANCH: kb-sync/craft-skills
    steps:
      - name: Check secret
        env: { T: '${{ secrets.XCONNECT_KB_TOKEN }}' }
        run: |
          if [ -z "$T" ]; then echo "::error::Add secret XCONNECT_KB_TOKEN"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ github.event_name == 'pull_request' && 'main' || github.sha }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.XC_REPO }}
          token: ${{ secrets.XCONNECT_KB_TOKEN }}
          path: xc
          fetch-depth: 0

      - name: Copy READMEs
        id: copy
        run: |
          cd xc
          if git ls-remote --exit-code origin "$SYNC_BRANCH" >/dev/null; then
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
            git merge --no-edit origin/main || { git merge --abort; git checkout -B "$SYNC_BRANCH" origin/main; }
          else
            git checkout -B "$SYNC_BRANCH" origin/main
          fi
          dest=knowledge/xiaox/craft-skills
          rm -rf "$dest"; mkdir -p "$dest"
          (cd ../src && git ls-files -z | grep -zaiE '(^|/)readme[^/]*\.md$' | xargs -0 -I{} cp --parents {} "../xc/$dest/")
          python3 tool/sync_knowledge_docs.py
          git add -A knowledge/xiaox lib/core/services/bot/xconnect_knowledge_docs.g.dart
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and open/refresh PR
        if: steps.copy.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.XCONNECT_KB_TOKEN }}
          SRC_REF: ${{ github.ref_name }}
          SRC_SHA: ${{ github.sha }}
        run: |
          cd xc
          git config user.name "craft-skills-sync"
          git config user.email "craft-skills-sync@users.noreply.github.com"
          git commit -m "小X knowledge: sync craft-skills READMEs from $SRC_REF@${SRC_SHA:0:7}"
          git push -f origin "$SYNC_BRANCH"
          body="Auto-sync of craft-skills README*.md (from \`$SRC_REF\`@${SRC_SHA:0:7}) into 小X knowledge. Review and merge by hand."
          if [ -z "$(gh pr list -R "$XC_REPO" --head "$SYNC_BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create -R "$XC_REPO" --head "$SYNC_BRANCH" --base main \
              --title "小X 知识库：同步 craft-skills README" --body "$body"
          else
            gh pr comment -R "$XC_REPO" "$SYNC_BRANCH" --body "Updated: $SRC_REF@${SRC_SHA:0:7}"
          fi

      - name: Optional live copy to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "R2 secrets not set; skipping"; exit 0; fi
          cd xc/knowledge/xiaox/craft-skills
          find . -name '*.md' | while read -r f; do
            npx --yes wrangler@3 r2 object put "xconnect-downloads/config/knowledge/craft-skills/${f#./}" \
              --file "$f" --content-type 'text/markdown; charset=utf-8' --remote
          done
